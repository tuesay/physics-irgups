<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика: Тренажер формул</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --success: #16a34a;
            --error: #dc2626;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
            line-height: 1.5;
        }
        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1, h2, h3 { color: var(--text); }
        .hidden { display: none !important; }
        
        /* Меню */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .menu-btn { background: var(--surface); color: var(--primary); border: 2px solid var(--primary); font-weight: 600;}
        .menu-btn:hover { background: var(--primary); color: white; }

        /* Квиз */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .option-btn {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            text-align: left;
            font-size: 1.2rem;
            padding: 1rem;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); }
        .option-btn.correct { background: #dcfce7; border-color: var(--success); }
        .option-btn.incorrect { background: #fee2e2; border-color: var(--error); }
        
        .explanation {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            border-left: 4px solid var(--primary);
        }
        .next-btn { width: 100%; margin-top: 1.5rem; }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 0.9rem; color: #64748b;}
        
        /* Результаты */
        .results-actions { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap;}
        .btn-secondary { background: #64748b; }
    </style>
</head>
<body>

    <div id="menu-screen" class="card">
        <h1>Тренажер формул</h1>
        <p>Выберите тему для проверки знаний. Если вы ошибетесь, система запомнит это и предложит работу над ошибками.</p>
        <div class="menu-grid" id="topics-container">
            </div>
    </div>

    <div id="quiz-screen" class="card hidden">
        <div class="top-bar">
            <span id="quiz-topic-title">Тема</span>
            <span id="quiz-progress">Вопрос 1 / 10</span>
        </div>
        <h2 id="question-text">Название формулы</h2>
        <div class="options-grid" id="options-container">
            </div>
        <div id="explanation-box" class="explanation hidden">
            <h3 style="margin-top: 0;">Пояснение:</h3>
            <p id="explanation-text"></p>
        </div>
        <button id="next-btn" class="next-btn hidden">Следующий вопрос</button>
    </div>

    <div id="results-screen" class="card hidden">
        <h2>Тест завершен!</h2>
        <p id="score-text" style="font-size: 1.2rem; font-weight: bold;"></p>
        <div class="results-actions">
            <button id="review-btn" class="hidden">Работа над ошибками</button>
            <button class="btn-secondary" onclick="showMenu()">Вернуться в меню</button>
        </div>
    </div>

        // Инициализация меню
        function init() {
            const container = document.getElementById('topics-container');
            for (const [key, title] of Object.entries(topicsMeta)) {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.innerText = title;
                btn.onclick = () => startQuiz(key);
                container.appendChild(btn);
            }
        }

        // Рендер формул MathJax
        function typeset() {
            if (window.MathJax) {
                MathJax.typesetPromise().catch((err) => console.log(err.message));
            }
        }

        function switchScreen(screenId) {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        function showMenu() {
            switchScreen('menu-screen');
        }

        function startQuiz(topicKey) {
            currentQuestions = [...db[topicKey]];
            // Перемешиваем вопросы
            currentQuestions.sort(() => Math.random() - 0.5);
            mistakesQueue = [];
            currentQuestionIndex = 0;
            score = 0;
            isReviewMode = false;
            
            document.getElementById('quiz-topic-title').innerText = topicsMeta[topicKey];
            switchScreen('quiz-screen');
            renderQuestion();
        }

        function startMistakesReview() {
            currentQuestions = [...mistakesQueue];
            mistakesQueue = [];
            currentQuestionIndex = 0;
            score = 0;
            isReviewMode = true;
            
            document.getElementById('quiz-topic-title').innerText = "Работа над ошибками";
            switchScreen('quiz-screen');
            renderQuestion();
        }

        function renderQuestion() {
            hasAnsweredCurrent = false;
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            
            const q = currentQuestions[currentQuestionIndex];
            document.getElementById('quiz-progress').innerText = `Вопрос ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('question-text').innerText = q.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = opt;
                btn.onclick = () => handleAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            typeset();
        }

        function handleAnswer(selectedIndex, btnElement) {
            if (hasAnsweredCurrent) return;
            hasAnsweredCurrent = true;
            
            const q = currentQuestions[currentQuestionIndex];
            const isCorrect = selectedIndex === q.correctIndex;
            
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.disabled = true);
            
            if (isCorrect) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('incorrect');
                allBtns[q.correctIndex].classList.add('correct');
                // Сохраняем в ошибки, если еще нет
                if (!mistakesQueue.includes(q)) {
                    mistakesQueue.push(q);
                }
            }
            
            // Показываем объяснение выбранного варианта
            const expBox = document.getElementById('explanation-box');
            document.getElementById('explanation-text').innerText = q.explanations[selectedIndex];
            expBox.classList.remove('hidden');
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
            nextBtn.onclick = () => {
                currentQuestionIndex++;
                if (currentQuestionIndex < currentQuestions.length) {
                    renderQuestion();
                } else {
                    showResults();
                }
            };
        }

        function showResults() {
            switchScreen('results-screen');
            const resultText = `Вы ответили верно на ${score} из ${currentQuestions.length} вопросов.`;
            document.getElementById('score-text').innerText = resultText;
            
            const reviewBtn = document.getElementById('review-btn');
            if (mistakesQueue.length > 0) {
                reviewBtn.classList.remove('hidden');
                reviewBtn.innerText = `Работа над ошибками (${mistakesQueue.length})`;
                reviewBtn.onclick = startMistakesReview;
            } else {
                reviewBtn.classList.add('hidden');
            }
        }

        // Запуск
        init();
    </script>
</body>
</html>
